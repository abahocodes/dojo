[package]
name = "dojo"
version = "0.1.0"
edition = "2024"
description = "Coding-interview practice in your terminal, solved in your own editor"
repository = "https://github.com/abahocodes/dojo"
homepage = "https://github.com/abahocodes/dojo"
readme = "README.md"

[features]
# Also run every question in the bank as its own test (each question's
# reference solutions and boilerplate in every language). Off by default:
# questions are validated once, in their own PR, by question.yml; dojo's CI
# tests the runner per language instead. `cargo test --features question-tests`.
question-tests = []

[dependencies]
anyhow = "1.0.104"
bon = "3.10.2"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
jiff = { version = "0.2.38", features = ["serde"] }
jsonschema = { version = "0.58.6", default-features = false }
keyring = "4.2.0"
nucleo-matcher = "0.3.1"
pulldown-cmark = "0.13.4"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
rust-embed = "8.13.0"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt"] }
toml = "1.1.6"
unicode-width = "0.2.2"

[target.'cfg(unix)'.dependencies]
# Ignoring Ctrl-C while a child owns the terminal; checking for root.
libc = "0.2.190"

# Build-time code (proc macros like sqlx-macros) is not stripped in release.
# On macOS 27 (ld-27037), stripping debuginfo from the sqlx-macros dylib leaves
# a misaligned LINKEDIT and rustc can't load it ("mis-aligned LINKEDIT string
# pool"). Affects compile-time artifacts only; the dojo binary is unchanged.
[profile.release.build-override]
strip = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[dev-dependencies]
rstest = "0.27.0"
