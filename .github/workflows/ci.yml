# CI for dojo itself: format, lint and dojo's tests, including the runner
# for every language. Questions are not re-run here: each one is validated
# once, in its own PR, by question.yml, so this stays fast as the bank grows.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["questions/**"]
  pull_request:
    paths-ignore: ["questions/**"]

env:
  CARGO_TERM_COLOR: always
  # SQL is checked against the committed .sqlx/ cache; no database needed.
  SQLX_OFFLINE: "true"

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # The toolchain is pinned in rust-toolchain.toml; rustup installs it.
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # Reference solutions and starter code run in both languages.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # Java solutions are compiled with javac and run on the same JDK.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # Not every runner image ships Go. C++ uses the runner's compiler.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      # The runner tests run every language (runner::language_tests); the
      # per-question tests stay off (feature `question-tests`).
      - name: Test
        run: cargo test
