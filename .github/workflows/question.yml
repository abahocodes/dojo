# Checks contributed questions: only the question folders a PR adds or
# changes are validated, plus the bank-wide id/slug uniqueness check. For
# each folder (`dojo validate --question`):
#   - schema: meta.json and tests.json against schema/*.json
#   - layout and content: files referenced, naming, hints, case types, limits
#     (case count, tests size, visible inputs small enough to print)
#   - runs safely in every language: reference solutions pass every case
#     under 1s each (the limit is 3s), give the same results on two runs, and
#     the boilerplate loads without already passing
# Separate from ci.yml, which tests dojo itself. Changed questions are split
# across up to 8 parallel jobs; dojo is built once and shared.
#
# Runs on `pull_request` (not `pull_request_target`), so code from forks runs
# with a read-only token and no secrets.
name: question

on:
  pull_request:
    # Files inside question folders (not questions/README.md).
    paths: ["questions/*/**"]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  # Which question folders changed, split into up to 8 shards so a PR that
  # adds many questions validates them in parallel.
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.split.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Split changed questions into shards
        id: split
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          dirs=$(git diff --name-only "$base" HEAD -- questions/ | awk -F/ 'NF > 2 { print $2 }' | sort -u \
            | while read -r dir; do
                # Removed folders have nothing left to validate.
                if [ -d "questions/$dir" ]; then echo "$dir"; fi
              done)
          echo "Changed: $(echo "$dirs" | grep -c . || true) questions"
          shards=$(echo "$dirs" | python3 -c '
          import json, math, sys
          dirs = [d for d in sys.stdin.read().split() if d]
          n = min(8, math.ceil(len(dirs) / 10)) if dirs else 0
          print(json.dumps([" ".join("--question " + d for d in dirs[i::n]) for i in range(n)]))
          ')
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The toolchain is pinned in rust-toolchain.toml; rustup installs it.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build dojo
        run: cargo build --release --quiet
      - uses: actions/upload-artifact@v7
        with:
          name: dojo
          path: target/release/dojo
          retention-days: 1

  validate:
    needs: [plan, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        args: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7

      # Reference solutions and starter code run in every language. The
      # runner image already has a C++ compiler.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - uses: actions/download-artifact@v8
        with:
          name: dojo
      - name: Validate this shard
        run: |
          chmod +x dojo
          ./dojo validate ${{ matrix.args }}
